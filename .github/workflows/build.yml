name: "Build"

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: build
        run: |
          cmake -A Win32 -S . -B build
          cmake --build build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: hd-seed-search
          path: |
            build/Release/hd-seed-search.exe
            build/Release/hd-seed-search-hook.dll

      # Pushing a v* tag makes a release with both files, which HD Toolbox's
      # build downloads
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" build/Release/hd-seed-search.exe build/Release/hd-seed-search-hook.dll --generate-notes
